<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Physics merge game with geography power-ups" />
    <title>Fruit Geography Game</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <button type="button" id="theme-btn" class="theme-pill" data-i18n-aria="hud.chooseTheme" aria-label="Choose theme">
          <span id="theme-emoji" class="sprite-slot"></span>
          <span id="theme-name">Classic</span>
        </button>
        <div class="scores">
          <div class="stat">
            <span data-i18n="hud.score">Score</span>
            <b id="score">0</b>
          </div>
          <div class="stat">
            <span data-i18n="hud.best">Best</span>
            <b id="best">0</b>
          </div>
        </div>
        <div class="highest" data-i18n-title="hud.highestObject" title="Highest object">
          <span class="highest-label" data-i18n="hud.top">Top</span>
          <span id="highest-emoji" class="sprite-slot"></span>
        </div>
        <button type="button" id="menu-btn" class="icon-btn" data-i18n-aria="hud.menu" aria-label="Menu"></button>
      </header>

      <div class="next-row">
        <div class="next-main">
          <span class="next-label" data-i18n="hud.next">Next</span>
          <span id="now-emoji" class="next-emoji sprite-slot"></span>
          <span id="now-name" class="next-name">Blueberry</span>
        </div>
        <div class="next-after">
          <span class="next-label" data-i18n="hud.then">Then</span>
          <span id="then-emoji" class="then-emoji sprite-slot"></span>
        </div>
      </div>

      <section class="stage" id="stage">
        <img id="board-bg" class="board-bg" alt="" />
        <canvas id="board" width="360" height="520"></canvas>
        <div id="danger-tag" class="danger-tag" hidden data-i18n="hud.danger">DANGER</div>
        <div id="target-banner" class="target-banner" hidden>
          <span data-i18n="target.banner">Tap an object to remove</span>
          <button type="button" id="target-cancel" class="btn btn-ghost" data-i18n="target.cancel">Cancel</button>
        </div>
      </section>

      <div class="power-row" id="powerups"></div>

      <div class="energy">
        <div class="energy-top">
          <span class="energy-label"><span id="energy-icon" class="sprite-slot"></span><span id="energy-subject">Geography energy</span></span>
          <span id="energy-status">Merges charge a quiz</span>
        </div>
        <div class="energy-bar" aria-label="Geography energy">
          <span id="energy-fill"></span>
        </div>
      </div>
    </div>

    <div id="overlays"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
