<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Physics merge game with geography power-ups" />
    <title>Fruit Geography Game</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <button type="button" id="theme-btn" class="theme-pill" aria-label="Change theme">
          <span id="theme-emoji">🍎</span>
          <span id="theme-name">Classic</span>
        </button>
        <div class="scores">
          <div class="stat">
            <span>Score</span>
            <b id="score">0</b>
          </div>
          <div class="stat">
            <span>Best</span>
            <b id="best">0</b>
          </div>
        </div>
        <div class="highest" title="Highest object">
          <span class="highest-label">Top</span>
          <span id="highest-emoji">🍒</span>
        </div>
        <button type="button" id="menu-btn" class="icon-btn" aria-label="Menu">☰</button>
      </header>

      <div class="next-row">
        <div class="next-main">
          <span class="next-label">Next</span>
          <span id="now-emoji" class="next-emoji">🍒</span>
          <span id="now-name" class="next-name">Cherry</span>
        </div>
        <div class="next-after">
          <span class="next-label">Then</span>
          <span id="then-emoji" class="then-emoji">🍓</span>
        </div>
      </div>

      <section class="stage" id="stage">
        <canvas id="board" width="360" height="520"></canvas>
        <div id="danger-tag" class="danger-tag" hidden>DANGER</div>
        <div id="target-banner" class="target-banner" hidden>
          <span>Tap an object to remove</span>
          <button type="button" id="target-cancel" class="btn btn-ghost">Cancel</button>
        </div>
      </section>

      <div class="power-row" id="powerups"></div>

      <div class="energy">
        <div class="energy-top">
          <span>🌍 Geography energy</span>
          <span id="energy-status">Merges charge a quiz</span>
        </div>
        <div class="energy-bar" aria-label="Geography energy">
          <span id="energy-fill"></span>
        </div>
      </div>
    </div>

    <div id="overlays"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
